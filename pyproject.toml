[build-system]
requires = ["setuptools>=77.0.3", "Cython>=3.0.12,<4"]
build-backend = "setuptools.build_meta"

[project]
name = "savemoney"
dynamic = ["version"]
description = "Simple Algorithm for Very Efficient Multiplexing of Oxford Nanopore Experiments for You!"
readme = "README.md"
requires-python = ">=3.10"
license = "CC-BY-NC-SA-4.0"
license-files = ["LICENSE"]
authors = [{name = "Masaaki Uematsu", email = "mu84@cornell.edu"}]
maintainers = [{name = "Masaaki Uematsu", email = "mu84@cornell.edu"}]
keywords = [
    "plasmid",
    "whole-plasmid",
    "sequencing",
    "alignment",
    "multiplexing",
    "barcode-free",
    "bayesian analysis",
    "prior information",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Cython",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "pandas>=1.5.3",
    "parasail>=1.3.4",
    "Pillow>=9.4.0",
    "PuLP[cbc]>=3.3.2,<5",
    "scipy>=1.11.4",
    "snapgene_reader>=0.1.20",
    "tqdm>=4.66.1",
    "biopython>=1.83",
    "matplotlib>=3.7.1",
    "numpy>=1.23.5",
    "pyspoa>=0.2.1",
]

[project.optional-dependencies]
bam = ["pysam>=0.22.0"]

[project.urls]
Homepage = "https://github.com/MasaakiU/MultiplexNanopore"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["savemoney", "savemoney.*"]
namespaces = false

[tool.setuptools.package-data]
# Keep the same probability model as the existing published package.
"savemoney.modules" = ["NanoporeStats_PDF/NanoporeStats_pdf_0.2.0.csv"]
"savemoney.modules.cython_functions" = ["alignment_functions.pyx"]
